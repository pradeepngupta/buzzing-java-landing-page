  server:
    port: ${PORT:8080}
  thymeleaf:
    cache: false

google:
  sheets:
    spreadsheet-id: ${GOOGLE_SHEET_ID:}
    range: ${GOOGLE_SHEET_RANGE:Waitlist!A:L}
    email-range: ${GOOGLE_SHEET_EMAIL_RANGE:Waitlist!B:B}

buzzing-java:
  api-base: ${WAITLIST_API_BASE:}
  book:
    title: "Buzzing Java"
    subtitle: "The Hidden Reason Java Remains the Foundation of Trusted Systems in the Age of AI"
    author: "Pradeep Gupta"
    launch-date: "December 7, 2026"
    launch-date-iso: "2026-12-07T00:00:00+05:30"
    description: "Buzzing Java distills three decades of system design and Java principles into a working playbook for enterprise systems that hold up in the AI era — not nostalgia, but the ideas that never went out of date."
    genre: "Technology & Engineering"
    language: "English"
  cta:
    label: "Get the Free Chapter + Launch Price"
    mode: "waitlist"
    link: "#waitlist"
  waitlist:
    counter:
      enabled: true
      threshold: 200
    party-options:
      - "Online"
      - "Offline"
      - "Not interested"
    expectations:
      - "Java's relevance in the age of AI"
      - "Java's longevity secrets"
      - "Practical patterns for real-world systems"
      - "Career / interview prep"
      - "System design depth"
      - "Just curious / supporting you"
      - "Other"
  freebie:
    enabled: false
    quantity: 100
    title: ""
    description: ""
  credibility:
    - value: "Java Since 1.3 → 25"
      label: ""
    - value: "40M Events/Day"
      label: "at Enterprise Scale"
    - value: |-
        IBM
          ↓
        Cisco
          ↓
        JPMorgan
      label: ""
    - value: "350+ Members"
      label: "Leading Java Community"
  teasers:
    - number: "01"
      title: "Longevity is a signal"
      description: "Two decades of staying power is rarely an accident. The more interesting question is what Java kept getting right."
    - number: "02"
      title: "Trust compounds"
      description: "In systems that move money and make decisions, familiarity is not complacency. It is an engineering advantage with a price."
    - number: "03"
      title: "The real world wins"
      description: "Production systems do not reward fashionable demos. They reward software that keeps its promises under pressure."
    - number: "04"
      title: "AI changes the question"
      description: "AI can generate code quickly. What it can't generate is a guarantee. Java's memory model, type system, and runtime contracts are the deterministic backstop for code whose origin — human or model — was never verified. Buzzing Java asks what still makes generated code worthy of trust, and answers it."
  perks:
    - title: "Launch date + price"
      description: "Hear first, before the public announcement."
    - title: "Launch party invite"
      description: "Join online or offline, on your terms."
    - title: "Book preview"
      description: "Get an early look at the ideas inside."
    - title: "Future extras"
      description: "Be first in line for thoughtful bonuses."
  seo:
    title: "Buzzing Java | Why Java Still Powers Trusted Systems"
    description: "Java's runtime contracts are the check your AI-generated code still has to pass. Discover why three decades of design discipline outlast every code-generation trend. Join the Buzzing Java book launch waitlist."
    canonical-url: "https://localhost:8080/"
    og-url: "https://localhost:8080/"
    base-path: "/"
    og-image: "https://localhost:8080/images/og-image.jpg"
    og-image-type: "image/jpeg"
    og-image-alt: "Java's runtime contracts are the check your AI-generated code still has to pass. Discover why three decades of design discipline outlast every code-generation trend. Join the Buzzing Java book launch waitlist."
    og-image-width: 1200
    og-image-height: 630
    og-site-name: "Buzzing Java"
    x-name: "@pradeepxgupta"
  faq:
    - question: "What is Buzzing Java about?"
      answer: "Buzzing Java explains why Java remains important in trusted enterprise systems and what its longevity teaches us about real-world engineering in the AI era."
    - question: "Who is this book for?"
      answer: "It is for Java builders, technical leaders, architects, interviewers, and curious engineers who want to understand durable systems."
    - question: "Why does this matter to senior engineers, not just juniors?"
      answer: "Framework churn affects everyone. Senior engineers often carry undocumented instincts about design that this book makes explicit and teachable; junior engineers get the same grounding years earlier than they'd otherwise find it."
    - question: "Is this an introductory Java book?"
      answer: "No. It is a perspective-driven book about engineering judgment, system trust, and Java's role in production, not a syntax tutorial."
    - question: "Why does Java still matter in the age of AI?"
      answer: "AI accelerates how fast code gets written, not how reliable it is. Java's memory model, thread-safety contracts, and type system don't ask whether code came from a human or a model — they enforce the same guarantees either way. That's the argument this book makes, with the JVM internals to back it up."
    - question: "When will Buzzing Java launch?"
      answer: "The planned launch date is December 7, 2026. Join the waitlist for updates."
    - question: "How can I join the waitlist?"
      answer: "Share your name, email, and launch-party preference in the short form on this page."
    - question: "What do waitlist members receive?"
      answer: "Waitlist members hear about the launch date and price first, and may receive a launch-party invitation and early book preview."
  launch-event:
    enabled: true
    name: "Buzzing Java Launch"
    start-date: "2026-12-07T19:00:00+05:30"
    end-date: ""
    event-status: "EventScheduled"
    event-attendance-mode: "MixedEventAttendanceMode"
    location: "Bengaluru, India"
  author:
    name: "Pradeep Gupta"
    bio: "20+ years building trusted, high-stakes Java systems in global custody and securities services. Writes about durable software at Beyond the Stack Now."
    photo: "images/author-photo.jpg"
    social:
      linkedin: "https://linkedin.com/in/pradgupt"
      x: "https://x.com/pradeepxgupta"
      github: "https://github.com/pradeepngupta"
      substack: "https://beyondthestacknow.substack.com"