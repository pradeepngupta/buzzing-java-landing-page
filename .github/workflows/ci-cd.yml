name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install asset minifiers
        run: |
          npm install --prefix "$RUNNER_TEMP/asset-minifiers" --no-save --no-package-lock \
            terser@5.43.1 clean-css@5.3.3

      - name: Export static site
        env:
          WAITLIST_API_BASE: https://api.buzzingjava.com
        run: >-
          java -jar target/buzzing-java-landing-page-0.1.0-SNAPSHOT.jar
          --spring.profiles.active=export
          --spring.main.web-application-type=none

      - name: Minify production assets
        run: |
          export MINIFIER_DIR="$RUNNER_TEMP/asset-minifiers"
          "$MINIFIER_DIR/node_modules/.bin/terser" dist/js/site.js \
            --compress --mangle --output "$MINIFIER_DIR/site.js"
          mv "$MINIFIER_DIR/site.js" dist/js/site.js
          node -e '
            const fs = require("node:fs");
            const CleanCSS = require(process.env.MINIFIER_DIR + "/node_modules/clean-css");
            const stylesheet = "dist/css/site.css";
            const result = new CleanCSS({ level: 2 }).minify(fs.readFileSync(stylesheet, "utf8"));
            if (result.errors.length > 0) {
              throw new Error(`clean-css failed: ${result.errors.join("; ")}`);
            }
            fs.writeFileSync(stylesheet, result.styles);
          '

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-render:
    name: Deploy Spring Boot app to Render
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets[format('RENDER_DEPLOY_HOOK_URL')] }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"